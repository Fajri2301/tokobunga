name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cfp_db_test
      DB_USERNAME: root
      DB_PASSWORD: testing-root-password

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cfp_db_test
          MYSQL_ROOT_PASSWORD: testing-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, gd, mbstring, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate application key
        run: php artisan key:generate

      - name: Validate dependencies
        run: composer validate --strict && composer audit --locked && npm audit --audit-level=high

      - name: Check PHP formatting
        run: php vendor/bin/pint --test

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test
