name: Deploy Laravel to cPanel via FTP

on:
  push:
    branches:
      - main # Jalankan otomatis jika ada push ke branch main

jobs:
  web-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Sesuaikan dengan versi PHP di cPanel Anda
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath
        
    - name: 📦 Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-dev
      
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Menggunakan versi 20 LTS agar konsisten dengan CI di atas
        
    - name: 📦 Install NPM Dependencies
      run: npm install
      
    - name: 🏗️ Build Assets (Vite)
      env:
        VITE_BROADCASTER: pusher
        VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
        VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}
      run: |
        npm run build

    - name: ➕ Commit built assets and patched index
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f public/build
        git add public/index.php
        git commit -m "chore: prepare files for cPanel deployment"

    - name: 🚀 Sync public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/
        server-dir: /public_html/zankidausat/
        state-name: .ftp-deploy-sync-state-public.json

    - name: 🚀 Sync core (zankidausat)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /zankidausat/
        state-name: .ftp-deploy-sync-state-core.json
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/public/**
          **/tests/**
          **/storage/**
          .github/**
          .env.example
          phpunit.xml
