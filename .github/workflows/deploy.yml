name: Deploy Laravel to cPanel via FTP

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  web-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    
    steps:
    - name: 🚚 Get tested code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
      
    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Sesuaikan dengan versi PHP di cPanel Anda
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath
        
    - name: 📦 Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-dev
      
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Menggunakan versi 20 LTS agar konsisten dengan CI di atas
        
    - name: 📦 Install NPM Dependencies
      run: npm ci
      
    - name: 🏗️ Build Assets (Vite)
      env:
        VITE_BROADCASTER: pusher
        VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
        VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}
      run: |
        npm run build

    - name: 🚀 Sync public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/
        server-dir: /public_html/zankidausat/
        state-name: .ftp-deploy-sync-state-public.json

    - name: 🚀 Sync core (zankidausat)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /zankidausat/
        state-name: .ftp-deploy-sync-state-core.json
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/public/**
          **/tests/**
          **/storage/**
          .github/**
          .env.example
          phpunit.xml
